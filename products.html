<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StockSense — Products</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1">StockSense</span>
    <div>
      <a href="dashboard.html" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
      <a href="products.html" class="btn btn-light btn-sm me-2">Products</a>
      <a href="receipts.html" class="btn btn-outline-light btn-sm me-2">Receipts</a>
      <a href="delivery.html" class="btn btn-outline-light btn-sm me-2">Delivery</a>
      <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
    </div>
  </nav>

  <div class="container mt-4">
    <h3 class="mb-4">Products</h3>

    <!-- Add Product Form -->
    <div class="card shadow-sm p-3 mb-4">
      <h5>Add New Product</h5>
      <div class="row g-2">
        <div class="col-md-3">
          <input type="text" id="productName" class="form-control" placeholder="Product Name">
        </div>
        <div class="col-md-2">
          <input type="text" id="sku" class="form-control" placeholder="SKU / Code">
        </div>
        <div class="col-md-2">
          <input type="text" id="category" class="form-control" placeholder="Category">
        </div>
        <div class="col-md-2">
          <input type="text" id="unit" class="form-control" placeholder="Unit (e.g. kg, pcs)">
        </div>
        <div class="col-md-2">
          <input type="number" id="initialStock" class="form-control" placeholder="Initial Stock">
        </div>
        <div class="col-md-1">
          <button id="addProductBtn" class="btn btn-primary w-100">Add</button>
        </div>
      </div>
      <p id="statusMsg" class="mt-2 mb-0"></p>
    </div>

    <!-- Products Table -->
    <div class="card shadow-sm p-3">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Name</th>
            <th>SKU</th>
            <th>Category</th>
            <th>Unit</th>
            <th>Stock Qty</th>
          </tr>
        </thead>
        <tbody id="productsTableBody">
          <tr><td colspan="5" class="text-center text-muted">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import {
      auth,
      db,
      onAuthStateChanged,
      signOut,
      collection,
      addDoc,
      getDocs
    } from "./firebase-config.js";

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "index.html";
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      signOut(auth).then(() => {
        window.location.href = "index.html";
      });
    });

    const statusMsg = document.getElementById("statusMsg");

    async function loadProducts() {
      const tbody = document.getElementById("productsTableBody");
      const snap = await getDocs(collection(db, "products"));

      if (snap.empty) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">No products yet — add one above.</td></tr>`;
        return;
      }

      tbody.innerHTML = "";
      snap.forEach((docSnap) => {
        const p = docSnap.data();
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${p.product_name ?? ""}</td>
          <td>${p.sku ?? ""}</td>
          <td>${p.category ?? ""}</td>
          <td>${p.unit ?? ""}</td>
          <td>${p.stock_qty ?? 0}</td>
        `;
        tbody.appendChild(row);
      });
    }

    document.getElementById("addProductBtn").addEventListener("click", async () => {
      const product_name = document.getElementById("productName").value.trim();
      const sku = document.getElementById("sku").value.trim();
      const category = document.getElementById("category").value.trim();
      const unit = document.getElementById("unit").value.trim();
      const stock_qty = parseFloat(document.getElementById("initialStock").value) || 0;

      if (!product_name || !sku) {
        statusMsg.textContent = "Product name and SKU are required.";
        statusMsg.className = "mt-2 mb-0 text-danger";
        return;
      }

      try {
        await addDoc(collection(db, "products"), {
          product_name,
          sku,
          category,
          unit,
          stock_qty,
          created_at: new Date().toISOString()
        });

        statusMsg.textContent = "Product added successfully.";
        statusMsg.className = "mt-2 mb-0 text-success";

        // Clear form
        document.getElementById("productName").value = "";
        document.getElementById("sku").value = "";
        document.getElementById("category").value = "";
        document.getElementById("unit").value = "";
        document.getElementById("initialStock").value = "";

        loadProducts();
      } catch (err) {
        statusMsg.textContent = err.message;
        statusMsg.className = "mt-2 mb-0 text-danger";
      }
    });

    loadProducts();
  </script>

</body>
</html>
