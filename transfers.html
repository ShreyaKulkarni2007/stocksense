<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StockSense — Transfers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1">StockSense</span>
    <div>
      <a href="dashboard.html" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
      <a href="products.html" class="btn btn-outline-light btn-sm me-2">Products</a>
      <a href="receipts.html" class="btn btn-outline-light btn-sm me-2">Receipts</a>
      <a href="delivery.html" class="btn btn-outline-light btn-sm me-2">Delivery</a>
      <a href="transfers.html" class="btn btn-light btn-sm me-2">Transfers</a>
      <a href="adjustments.html" class="btn btn-outline-light btn-sm me-2">Adjustments</a>
      <a href="ledger.html" class="btn btn-outline-light btn-sm me-2">Ledger</a>
      <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
    </div>
  </nav>

  <div class="container mt-4">
    <h3 class="mb-4">Internal Transfers</h3>
    <p class="text-muted">Move stock between locations inside the company. Total stock is unaffected — only location changes.</p>

    <div class="card shadow-sm p-3 mb-4">
      <h5>Transfer Stock</h5>
      <div class="row g-2 align-items-center">
        <div class="col-md-3">
          <select id="productSelect" class="form-select">
            <option value="">Select a product...</option>
          </select>
        </div>
        <div class="col-md-2">
          <input type="text" id="fromLocation" class="form-control" placeholder="From (e.g. Main Warehouse)">
        </div>
        <div class="col-md-2">
          <input type="text" id="toLocation" class="form-control" placeholder="To (e.g. Production Floor)">
        </div>
        <div class="col-md-2">
          <input type="number" id="qtyTransferred" class="form-control" placeholder="Quantity">
        </div>
        <div class="col-md-3">
          <button id="transferBtn" class="btn btn-info w-100">Transfer</button>
        </div>
      </div>
      <p id="statusMsg" class="mt-2 mb-0"></p>
    </div>

    <div class="card shadow-sm p-3">
      <h5>Transfer History</h5>
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Product</th>
            <th>From</th>
            <th>To</th>
            <th>Quantity</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="transfersTableBody">
          <tr><td colspan="5" class="text-center text-muted">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import {
      auth,
      db,
      onAuthStateChanged,
      signOut,
      collection,
      addDoc,
      getDocs
    } from "./firebase-config.js";

    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = "index.html";
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      signOut(auth).then(() => window.location.href = "index.html");
    });

    const statusMsg = document.getElementById("statusMsg");
    const productSelect = document.getElementById("productSelect");

    async function loadProductOptions() {
      const snap = await getDocs(collection(db, "products"));
      productSelect.innerHTML = `<option value="">Select a product...</option>`;
      snap.forEach((docSnap) => {
        const p = docSnap.data();
        const opt = document.createElement("option");
        opt.value = docSnap.id;
        opt.textContent = `${p.product_name} (${p.sku})`;
        productSelect.appendChild(opt);
      });
    }

    async function loadTransfers() {
      const tbody = document.getElementById("transfersTableBody");
      const snap = await getDocs(collection(db, "transfers"));

      if (snap.empty) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">No transfers yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = "";
      snap.forEach((docSnap) => {
        const t = docSnap.data();
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${t.product_name ?? ""}</td>
          <td>${t.from_location ?? ""}</td>
          <td>${t.to_location ?? ""}</td>
          <td>${t.quantity ?? 0}</td>
          <td>${t.created_at ? new Date(t.created_at).toLocaleString() : ""}</td>
        `;
        tbody.appendChild(row);
      });
    }

    document.getElementById("transferBtn").addEventListener("click", async () => {
      const productId = productSelect.value;
      const productName = productSelect.options[productSelect.selectedIndex]?.textContent ?? "";
      const fromLocation = document.getElementById("fromLocation").value.trim();
      const toLocation = document.getElementById("toLocation").value.trim();
      const quantity = parseFloat(document.getElementById("qtyTransferred").value);

      if (!productId || !fromLocation || !toLocation || !quantity || quantity <= 0) {
        statusMsg.textContent = "Fill all fields with a valid quantity.";
        statusMsg.className = "mt-2 mb-0 text-danger";
        return;
      }

      try {
        await addDoc(collection(db, "transfers"), {
          product_id: productId,
          product_name: productName,
          from_location: fromLocation,
          to_location: toLocation,
          quantity,
          created_at: new Date().toISOString()
        });

        // Log to the shared stock ledger (total stock unaffected, so change = 0)
        await addDoc(collection(db, "stock_ledger"), {
          type: "Transfer",
          product_id: productId,
          product_name: productName,
          change: 0,
          previous_qty: null,
          new_qty: null,
          details: `${quantity} moved: ${fromLocation} → ${toLocation}`,
          created_at: new Date().toISOString()
        });

        statusMsg.textContent = "Transfer logged successfully.";
        statusMsg.className = "mt-2 mb-0 text-success";

        document.getElementById("fromLocation").value = "";
        document.getElementById("toLocation").value = "";
        document.getElementById("qtyTransferred").value = "";

        loadTransfers();
      } catch (err) {
        statusMsg.textContent = err.message;
        statusMsg.className = "mt-2 mb-0 text-danger";
      }
    });

    loadProductOptions();
    loadTransfers();
  </script>

</body>
</html>
