<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StockSense — Receipts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1">StockSense</span>
    <div>
      <a href="dashboard.html" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
      <a href="products.html" class="btn btn-outline-light btn-sm me-2">Products</a>
      <a href="receipts.html" class="btn btn-light btn-sm me-2">Receipts</a>
      <a href="delivery.html" class="btn btn-outline-light btn-sm me-2">Delivery</a>
      <a href="transfers.html" class="btn btn-outline-light btn-sm me-2">Transfers</a>
      <a href="adjustments.html" class="btn btn-outline-light btn-sm me-2">Adjustments</a>
      <a href="ledger.html" class="btn btn-outline-light btn-sm me-2">Ledger</a>
      <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
    </div>
  </nav>

  <div class="container mt-4">
    <h3 class="mb-4">Receipts (Incoming Stock)</h3>

    <div class="card shadow-sm p-3 mb-4">
      <h5>Receive Stock</h5>
      <div class="row g-2 align-items-center">
        <div class="col-md-4">
          <select id="productSelect" class="form-select">
            <option value="">Select a product...</option>
          </select>
        </div>
        <div class="col-md-2">
          <input type="text" id="supplier" class="form-control" placeholder="Supplier">
        </div>
        <div class="col-md-3">
          <input type="number" id="qtyReceived" class="form-control" placeholder="Quantity Received">
        </div>
        <div class="col-md-3">
          <button id="validateBtn" class="btn btn-success w-100">Validate Receipt</button>
        </div>
      </div>
      <p id="statusMsg" class="mt-2 mb-0"></p>
    </div>

    <div class="card shadow-sm p-3">
      <h5>Receipt History</h5>
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Product</th>
            <th>Supplier</th>
            <th>Quantity</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="receiptsTableBody">
          <tr><td colspan="4" class="text-center text-muted">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import {
      auth,
      db,
      onAuthStateChanged,
      signOut,
      collection,
      addDoc,
      getDocs,
      doc,
      getDoc,
      updateDoc,
      increment
    } from "./firebase-config.js";

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "index.html";
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      signOut(auth).then(() => {
        window.location.href = "index.html";
      });
    });

    const statusMsg = document.getElementById("statusMsg");
    const productSelect = document.getElementById("productSelect");

    async function loadProductOptions() {
      const snap = await getDocs(collection(db, "products"));
      productSelect.innerHTML = `<option value="">Select a product...</option>`;
      snap.forEach((docSnap) => {
        const p = docSnap.data();
        const opt = document.createElement("option");
        opt.value = docSnap.id;
        opt.textContent = `${p.product_name} (${p.sku})`;
        productSelect.appendChild(opt);
      });
    }

    async function loadReceipts() {
      const tbody = document.getElementById("receiptsTableBody");
      const snap = await getDocs(collection(db, "receipts"));

      if (snap.empty) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted">No receipts yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = "";
      snap.forEach((docSnap) => {
        const r = docSnap.data();
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${r.product_name ?? ""}</td>
          <td>${r.supplier ?? ""}</td>
          <td>${r.quantity ?? 0}</td>
          <td>${r.created_at ? new Date(r.created_at).toLocaleString() : ""}</td>
        `;
        tbody.appendChild(row);
      });
    }

    document.getElementById("validateBtn").addEventListener("click", async () => {
      const productId = productSelect.value;
      const supplier = document.getElementById("supplier").value.trim();
      const quantity = parseFloat(document.getElementById("qtyReceived").value);

      if (!productId || !quantity || quantity <= 0) {
        statusMsg.textContent = "Select a product and enter a valid quantity.";
        statusMsg.className = "mt-2 mb-0 text-danger";
        return;
      }

      try {
        // Get product name for logging (read-only, not used for the math)
        const productRef = doc(db, "products", productId);
        const productSnap = await getDoc(productRef);
        const productData = productSnap.data();
        const previousQty = productData.stock_qty ?? 0;

        // Atomically increase stock — safe even if another update happens at the same time
        await updateDoc(productRef, {
          stock_qty: increment(quantity)
        });

        // Log the receipt
        await addDoc(collection(db, "receipts"), {
          product_id: productId,
          product_name: productData.product_name,
          supplier,
          quantity,
          created_at: new Date().toISOString()
        });

        // Log to the shared stock ledger
        await addDoc(collection(db, "stock_ledger"), {
          type: "Receipt",
          product_id: productId,
          product_name: productData.product_name,
          change: quantity,
          previous_qty: previousQty,
          new_qty: previousQty + quantity,
          details: `Received from ${supplier || "supplier"}`,
          created_at: new Date().toISOString()
        });

        statusMsg.textContent = `Receipt validated: +${quantity} ${productData.product_name}.`;
        statusMsg.className = "mt-2 mb-0 text-success";

        document.getElementById("supplier").value = "";
        document.getElementById("qtyReceived").value = "";

        loadReceipts();
      } catch (err) {
        statusMsg.textContent = err.message;
        statusMsg.className = "mt-2 mb-0 text-danger";
      }
    });

    loadProductOptions();
    loadReceipts();
  </script>

</body>
</html>
