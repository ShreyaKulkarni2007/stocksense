<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StockSense — Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1">StockSense</span>
    <div>
      <a href="dashboard.html" class="btn btn-light btn-sm me-2">Dashboard</a>
      <a href="products.html" class="btn btn-outline-light btn-sm me-2">Products</a>
      <a href="receipts.html" class="btn btn-outline-light btn-sm me-2">Receipts</a>
      <a href="delivery.html" class="btn btn-outline-light btn-sm me-2">Delivery</a>
      <a href="transfers.html" class="btn btn-outline-light btn-sm me-2">Transfers</a>
      <a href="adjustments.html" class="btn btn-outline-light btn-sm me-2">Adjustments</a>
      <a href="ledger.html" class="btn btn-outline-light btn-sm me-2">Ledger</a>
      <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
    </div>
  </nav>

  <div class="container mt-4">
    <h3 class="mb-4">Dashboard</h3>

    <div class="row g-3">
      <div class="col-md-3">
        <div class="card shadow-sm p-3 text-center">
          <h6 class="text-muted">Total Products</h6>
          <h2 id="totalProducts">--</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-sm p-3 text-center">
          <h6 class="text-muted">Low Stock Items</h6>
          <h2 id="lowStock" class="text-danger">--</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-sm p-3 text-center">
          <h6 class="text-muted">Total Receipts</h6>
          <h2 id="totalReceipts">--</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-sm p-3 text-center">
          <h6 class="text-muted">Total Deliveries</h6>
          <h2 id="totalDeliveries">--</h2>
        </div>
      </div>
    </div>

    <div id="lowStockAlert" class="alert alert-danger mt-4 d-none">
      <h6 class="mb-2">⚠️ Low Stock Alert</h6>
      <ul id="lowStockList" class="mb-0"></ul>
    </div>

    <div id="noLowStock" class="alert alert-success mt-4 d-none">
      ✅ All products are well stocked.
    </div>

    <div class="card shadow-sm p-3 mt-4">
      <h5 class="mb-3">Stock Levels by Product</h5>
      <canvas id="stockChart" height="90"></canvas>
    </div>

    <div class="card shadow-sm p-3 mt-4">
      <h5 class="mb-3">Recent Activity</h5>
      <ul id="recentActivity" class="list-group list-group-flush">
        <li class="list-group-item text-muted">Loading...</li>
      </ul>
    </div>
  </div>

  <script type="module">
    import {
      auth,
      db,
      onAuthStateChanged,
      signOut,
      collection,
      getDocs
    } from "./firebase-config.js";

    const LOW_STOCK_THRESHOLD = 10;

    // Redirect to login if not authenticated
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "index.html";
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      signOut(auth).then(() => {
        window.location.href = "index.html";
      });
    });

    async function loadDashboard() {
      // Products + low stock
      const productsSnap = await getDocs(collection(db, "products"));
      let totalProducts = 0;
      let lowStock = 0;
      let lowStockItems = [];
      let chartLabels = [];
      let chartValues = [];
      let chartColors = [];
      productsSnap.forEach((docSnap) => {
        totalProducts++;
        const data = docSnap.data();
        const qty = data.stock_qty ?? 0;
        const label = data.product_name ?? docSnap.id;
        if (qty < LOW_STOCK_THRESHOLD) {
          lowStock++;
          lowStockItems.push({ name: label, qty });
        }
        chartLabels.push(label);
        chartValues.push(qty);
        chartColors.push(qty < LOW_STOCK_THRESHOLD ? "#dc3545" : "#0d6efd");
      });
      document.getElementById("totalProducts").textContent = totalProducts;
      document.getElementById("lowStock").textContent = lowStock;

      if (lowStockItems.length > 0) {
        document.getElementById("lowStockAlert").classList.remove("d-none");
        document.getElementById("lowStockList").innerHTML = lowStockItems
          .map(item => `<li>${item.name} — only ${item.qty} left</li>`)
          .join("");
      } else {
        document.getElementById("noLowStock").classList.remove("d-none");
      }

      // Receipts count
      const receiptsSnap = await getDocs(collection(db, "receipts"));
      document.getElementById("totalReceipts").textContent = receiptsSnap.size;

      // Deliveries count
      const deliveriesSnap = await getDocs(collection(db, "deliveries"));
      document.getElementById("totalDeliveries").textContent = deliveriesSnap.size;

      // Recent activity (last 5 entries from the shared stock ledger)
      const ledgerSnap = await getDocs(collection(db, "stock_ledger"));
      const ledgerEntries = [];
      ledgerSnap.forEach((docSnap) => ledgerEntries.push(docSnap.data()));
      ledgerEntries.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

      const activityList = document.getElementById("recentActivity");
      if (ledgerEntries.length === 0) {
        activityList.innerHTML = `<li class="list-group-item text-muted">No activity yet.</li>`;
      } else {
        const badgeClass = {
          Receipt: "bg-success",
          Delivery: "bg-warning text-dark",
          Transfer: "bg-info text-dark",
          Adjustment: "bg-secondary"
        };
        activityList.innerHTML = ledgerEntries.slice(0, 5).map((e) => {
          const cls = badgeClass[e.type] ?? "bg-dark";
          const when = e.created_at ? new Date(e.created_at).toLocaleString() : "";
          return `<li class="list-group-item d-flex justify-content-between align-items-center">
            <span><span class="badge ${cls} me-2">${e.type ?? ""}</span>${e.product_name ?? ""} — ${e.details ?? ""}</span>
            <small class="text-muted">${when}</small>
          </li>`;
        }).join("");
      }

      // Stock levels chart (red bars = low stock, blue = healthy)
      new Chart(document.getElementById("stockChart"), {
        type: "bar",
        data: {
          labels: chartLabels,
          datasets: [{
            label: "Stock Quantity",
            data: chartValues,
            backgroundColor: chartColors
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    loadDashboard();
  </script>

</body>
</html>
