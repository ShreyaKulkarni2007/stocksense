<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StockSense — Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1">StockSense</span>
    <div>
      <a href="dashboard.html" class="btn btn-light btn-sm me-2">Dashboard</a>
      <a href="products.html" class="btn btn-outline-light btn-sm me-2">Products</a>
      <a href="receipts.html" class="btn btn-outline-light btn-sm me-2">Receipts</a>
      <a href="delivery.html" class="btn btn-outline-light btn-sm me-2">Delivery</a>
      <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
    </div>
  </nav>

  <div class="container mt-4">
    <h3 class="mb-4">Dashboard</h3>

    <div class="row g-3">
      <div class="col-md-3">
        <div class="card shadow-sm p-3 text-center">
          <h6 class="text-muted">Total Products</h6>
          <h2 id="totalProducts">--</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-sm p-3 text-center">
          <h6 class="text-muted">Low Stock Items</h6>
          <h2 id="lowStock" class="text-danger">--</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-sm p-3 text-center">
          <h6 class="text-muted">Total Receipts</h6>
          <h2 id="totalReceipts">--</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-sm p-3 text-center">
          <h6 class="text-muted">Total Deliveries</h6>
          <h2 id="totalDeliveries">--</h2>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      auth,
      db,
      onAuthStateChanged,
      signOut,
      collection,
      getDocs
    } from "./firebase-config.js";

    const LOW_STOCK_THRESHOLD = 10;

    // Redirect to login if not authenticated
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "index.html";
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      signOut(auth).then(() => {
        window.location.href = "index.html";
      });
    });

    async function loadDashboard() {
      // Products + low stock
      const productsSnap = await getDocs(collection(db, "products"));
      let totalProducts = 0;
      let lowStock = 0;
      productsSnap.forEach((docSnap) => {
        totalProducts++;
        const data = docSnap.data();
        if ((data.stock_qty ?? 0) < LOW_STOCK_THRESHOLD) {
          lowStock++;
        }
      });
      document.getElementById("totalProducts").textContent = totalProducts;
      document.getElementById("lowStock").textContent = lowStock;

      // Receipts count
      const receiptsSnap = await getDocs(collection(db, "receipts"));
      document.getElementById("totalReceipts").textContent = receiptsSnap.size;

      // Deliveries count
      const deliveriesSnap = await getDocs(collection(db, "deliveries"));
      document.getElementById("totalDeliveries").textContent = deliveriesSnap.size;
    }

    loadDashboard();
  </script>

</body>
</html>
