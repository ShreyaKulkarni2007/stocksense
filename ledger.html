<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StockSense — Stock Ledger</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1">StockSense</span>
    <div>
      <a href="dashboard.html" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
      <a href="products.html" class="btn btn-outline-light btn-sm me-2">Products</a>
      <a href="receipts.html" class="btn btn-outline-light btn-sm me-2">Receipts</a>
      <a href="delivery.html" class="btn btn-outline-light btn-sm me-2">Delivery</a>
      <a href="transfers.html" class="btn btn-outline-light btn-sm me-2">Transfers</a>
      <a href="adjustments.html" class="btn btn-outline-light btn-sm me-2">Adjustments</a>
      <a href="ledger.html" class="btn btn-light btn-sm me-2">Ledger</a>
      <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
    </div>
  </nav>

  <div class="container mt-4">
    <h3 class="mb-2">Stock Ledger</h3>
    <p class="text-muted">A complete, unified log of every stock-affecting action across the system — receipts, deliveries, transfers, and adjustments.</p>

    <div class="card shadow-sm p-3">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Type</th>
            <th>Product</th>
            <th>Change</th>
            <th>Details</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="ledgerTableBody">
          <tr><td colspan="5" class="text-center text-muted">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import {
      auth,
      db,
      onAuthStateChanged,
      signOut,
      collection,
      getDocs
    } from "./firebase-config.js";

    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = "index.html";
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      signOut(auth).then(() => window.location.href = "index.html");
    });

    const typeBadge = {
      Receipt: "bg-success",
      Delivery: "bg-warning text-dark",
      Transfer: "bg-info text-dark",
      Adjustment: "bg-secondary"
    };

    async function loadLedger() {
      const tbody = document.getElementById("ledgerTableBody");
      const snap = await getDocs(collection(db, "stock_ledger"));

      if (snap.empty) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">No ledger entries yet.</td></tr>`;
        return;
      }

      // Collect and sort newest first (client-side, so no extra Firestore index needed)
      const entries = [];
      snap.forEach((docSnap) => entries.push(docSnap.data()));
      entries.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

      tbody.innerHTML = "";
      entries.forEach((e) => {
        const change = e.change ?? 0;
        const changeText = change > 0 ? `+${change}` : `${change}`;
        const changeClass = change > 0 ? "text-success" : change < 0 ? "text-danger" : "text-muted";
        const badgeClass = typeBadge[e.type] ?? "bg-dark";

        const row = document.createElement("tr");
        row.innerHTML = `
          <td><span class="badge ${badgeClass}">${e.type ?? ""}</span></td>
          <td>${e.product_name ?? ""}</td>
          <td class="${changeClass}">${changeText}</td>
          <td>${e.details ?? ""}</td>
          <td>${e.created_at ? new Date(e.created_at).toLocaleString() : ""}</td>
        `;
        tbody.appendChild(row);
      });
    }

    loadLedger();
  </script>

</body>
</html>
