<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StockSense — Adjustments</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1">StockSense</span>
    <div>
      <a href="dashboard.html" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
      <a href="products.html" class="btn btn-outline-light btn-sm me-2">Products</a>
      <a href="receipts.html" class="btn btn-outline-light btn-sm me-2">Receipts</a>
      <a href="delivery.html" class="btn btn-outline-light btn-sm me-2">Delivery</a>
      <a href="transfers.html" class="btn btn-outline-light btn-sm me-2">Transfers</a>
      <a href="adjustments.html" class="btn btn-light btn-sm me-2">Adjustments</a>
      <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
    </div>
  </nav>

  <div class="container mt-4">
    <h3 class="mb-4">Stock Adjustments</h3>
    <p class="text-muted">Fix mismatches between recorded stock and physical count.</p>

    <div class="card shadow-sm p-3 mb-4">
      <h5>Adjust Stock</h5>
      <div class="row g-2 align-items-center">
        <div class="col-md-4">
          <select id="productSelect" class="form-select">
            <option value="">Select a product...</option>
          </select>
        </div>
        <div class="col-md-3">
          <input type="number" id="countedQty" class="form-control" placeholder="Counted Quantity">
        </div>
        <div class="col-md-2">
          <span id="currentStockDisplay" class="text-muted">Current: --</span>
        </div>
        <div class="col-md-3">
          <button id="adjustBtn" class="btn btn-secondary w-100">Apply Adjustment</button>
        </div>
      </div>
      <p id="statusMsg" class="mt-2 mb-0"></p>
    </div>

    <div class="card shadow-sm p-3">
      <h5>Adjustment History</h5>
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Product</th>
            <th>Previous Qty</th>
            <th>Counted Qty</th>
            <th>Difference</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="adjustmentsTableBody">
          <tr><td colspan="5" class="text-center text-muted">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import {
      auth,
      db,
      onAuthStateChanged,
      signOut,
      collection,
      addDoc,
      getDocs,
      doc,
      getDoc,
      updateDoc
    } from "./firebase-config.js";

    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = "index.html";
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      signOut(auth).then(() => window.location.href = "index.html");
    });

    const statusMsg = document.getElementById("statusMsg");
    const productSelect = document.getElementById("productSelect");
    const currentStockDisplay = document.getElementById("currentStockDisplay");

    let productsCache = {};

    async function loadProductOptions() {
      const snap = await getDocs(collection(db, "products"));
      productSelect.innerHTML = `<option value="">Select a product...</option>`;
      productsCache = {};
      snap.forEach((docSnap) => {
        const p = docSnap.data();
        productsCache[docSnap.id] = p;
        const opt = document.createElement("option");
        opt.value = docSnap.id;
        opt.textContent = `${p.product_name} (${p.sku})`;
        productSelect.appendChild(opt);
      });
    }

    productSelect.addEventListener("change", () => {
      const p = productsCache[productSelect.value];
      currentStockDisplay.textContent = p ? `Current: ${p.stock_qty ?? 0}` : "Current: --";
    });

    async function loadAdjustments() {
      const tbody = document.getElementById("adjustmentsTableBody");
      const snap = await getDocs(collection(db, "adjustments"));

      if (snap.empty) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">No adjustments yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = "";
      snap.forEach((docSnap) => {
        const a = docSnap.data();
        const diff = (a.counted_qty ?? 0) - (a.previous_qty ?? 0);
        const diffClass = diff < 0 ? "text-danger" : diff > 0 ? "text-success" : "";
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${a.product_name ?? ""}</td>
          <td>${a.previous_qty ?? 0}</td>
          <td>${a.counted_qty ?? 0}</td>
          <td class="${diffClass}">${diff > 0 ? "+" : ""}${diff}</td>
          <td>${a.created_at ? new Date(a.created_at).toLocaleString() : ""}</td>
        `;
        tbody.appendChild(row);
      });
    }

    document.getElementById("adjustBtn").addEventListener("click", async () => {
      const productId = productSelect.value;
      const countedQty = parseFloat(document.getElementById("countedQty").value);

      if (!productId || isNaN(countedQty) || countedQty < 0) {
        statusMsg.textContent = "Select a product and enter a valid counted quantity.";
        statusMsg.className = "mt-2 mb-0 text-danger";
        return;
      }

      try {
        const productRef = doc(db, "products", productId);
        const productSnap = await getDoc(productRef);
        const productData = productSnap.data();
        const previousQty = productData.stock_qty ?? 0;

        await updateDoc(productRef, { stock_qty: countedQty });

        await addDoc(collection(db, "adjustments"), {
          product_id: productId,
          product_name: productData.product_name,
          previous_qty: previousQty,
          counted_qty: countedQty,
          created_at: new Date().toISOString()
        });

        statusMsg.textContent = `Adjusted: ${productData.product_name} is now ${countedQty}.`;
        statusMsg.className = "mt-2 mb-0 text-success";

        document.getElementById("countedQty").value = "";
        currentStockDisplay.textContent = "Current: --";

        loadProductOptions();
        loadAdjustments();
      } catch (err) {
        statusMsg.textContent = err.message;
        statusMsg.className = "mt-2 mb-0 text-danger";
      }
    });

    loadProductOptions();
    loadAdjustments();
  </script>

</body>
</html>
