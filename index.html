<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StockSense — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="d-flex justify-content-center align-items-center" style="height:100vh;">
    <div class="card shadow p-4" style="width: 350px;">
      <h3 class="text-center mb-3">StockSense</h3>
      <p class="text-center text-muted">Inventory Management System</p>

      <input type="email" id="email" class="form-control mb-2" placeholder="Email">
      <input type="password" id="password" class="form-control mb-3" placeholder="Password">

      <button id="loginBtn" class="btn btn-primary w-100 mb-2">Login</button>
      <button id="signupBtn" class="btn btn-outline-secondary w-100">Sign Up</button>

      <p id="errorMsg" class="text-danger text-center mt-3 mb-0"></p>
    </div>
  </div>

  <script type="module">
    import {
      auth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword
    } from "./firebase-config.js";

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const errorMsg = document.getElementById("errorMsg");

    document.getElementById("loginBtn").addEventListener("click", () => {
      signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
        .then(() => {
          window.location.href = "dashboard.html";
        })
        .catch((err) => {
          errorMsg.textContent = err.message;
        });
    });

    document.getElementById("signupBtn").addEventListener("click", () => {
      createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
        .then(() => {
          window.location.href = "dashboard.html";
        })
        .catch((err) => {
          errorMsg.textContent = err.message;
        });
    });
  </script>

</body>
</html>
